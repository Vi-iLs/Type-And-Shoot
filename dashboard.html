<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Kalkulator Invest</title>
    <style>
        :root {
            --bg-main: #0b0f19;       /* Dark slate biru premium */
            --bg-container: #151f32;  /* Kontainer sedikit lebih terang */
            --text-color: #f8fafc;     /* Putih pudar agar nyaman di mata */
            --border-color: #24324d;   /* Border tipis kebiruan */
            --input-bg: #1d293e;       /* Background input yang kontras */
            --button-color: #3b82f6;   /* Biru modern */
            --button-hover: #2563eb;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-color);
            max-width: 950px;
            margin: 0 auto;
            padding: 15px;
        }

        .container {
            background-color: var(--bg-container);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            margin-bottom: 30px; 
        }

        .dashboard-title-row {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 0 25px;
            padding: 0 0 15px;
            border-bottom: 1px solid var(--border-color);
            min-height: 27px;
        }

        .dashboard-title-row h1 {
            color: var(--text-color);
            text-align: center;
            border: 0;
            padding: 0;
            margin: 0;
            width: 100%;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .dashboard-title-actions {
            position: absolute;
            top: 0;
            right: 0;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .web-url-toggle {
            position: absolute;
            top: 0;
            left: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 27px;
            height: 27px;
            padding: 0;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #101827;
            color: #94a3b8;
            font-size: 17px;
            line-height: 1;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s, background 0.2s;
        }

        .web-url-toggle:hover,
        .web-url-toggle:focus-visible {
            color: var(--text-color);
            border-color: #3b82f6;
            outline: none;
        }

        .force-reset-btn {
            position: static;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 5px 7px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: transparent;
            color: #94a3b8;
            font-size: 10px;
            font-weight: 500;
            line-height: 1;
            cursor: pointer;
            opacity: 0.72;
            transition: opacity 0.2s, border-color 0.2s, color 0.2s;
        }

        .force-reset-btn:hover,
        .force-reset-btn:focus-visible {
            opacity: 1;
            color: var(--text-color);
            border-color: #64748b;
            outline: none;
        }

        .force-reset-btn:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        label {
            font-weight: 500;
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            color: #94a3b8;
            font-size: 14px;
        }

        textarea, input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;       
            box-sizing: border-box;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 16px; /* Update anti-zoom di iOS */
            background-color: var(--input-bg);
            color: var(--text-color);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--button-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        #inputData {
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            resize: vertical;
            height: 180px;
            padding: 10px;
            font-size: 16px; 
            letter-spacing: 0.5px;
            line-height: 1.5;
            overflow-y: auto;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 2fr;
            gap: 15px;
        }

        button.btn-execute {
            background-color: var(--button-color);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button.btn-execute:hover {
            background-color: var(--button-hover);
            transform: translateY(-1px);
        }

        button.btn-execute:active {
            transform: translateY(1px);
        }

        .bottom-layout {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .output-container {
            position: relative;
            width: 100%;
        }

        #outputData {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: #34d399;
            font-weight: bold;
            padding-right: 80px;
            resize: vertical;
            height: 200px;
            font-size: 16px;
            line-height: 1.6;
            overflow-y: auto;
        }

        button.btn-copy {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #1e293b;
            color: white;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.btn-copy:hover {
            background-color: #334155;
        }

        .match-box {
            background-color: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            min-height: 320px;
        }

        .match-layout {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .side-by-side-results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* GAYA UNTUK TOMBOL NAVIGASI MELAYANG (FLOATING BUTTONS) */
        .floating-nav {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 9999;
        }

        .nav-btn {
            background-color: #1e293b;
            color: #3b82f6;
            border: 2px solid #24324d;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: all 0.2s;
            opacity: 0.8;
        }

        .nav-btn:hover, .nav-btn:active {
            opacity: 1;
            background-color: #3b82f6;
            color: white;
            transform: scale(1.05);
        }

        @media (min-width: 768px) {
            .main-layout {
                display: grid;
                grid-template-columns: 1fr 1.2fr;
                gap: 25px;
            }
            .bottom-layout {
                display: grid;
                grid-template-columns: 1fr 1.3fr;
                gap: 25px;
            }
            #inputData { height: 340px; }
            #outputData { height: 340px; }
            
            .match-layout {
                display: grid;
                grid-template-columns: 1fr 1.2fr;
            }
            
            /* Sembunyikan tombol navigasi jika di layar besar/PC */
            .floating-nav { display: none; }
        }
    
        /* Pengaturan URL website: ringkas dan tertutup secara default */
        .web-url-panel {
            margin: 0 0 14px;
            padding: 0;
            border: 0;
            background: transparent;
        }
        .web-url-panel-content {
            display: none;
            max-width: 100%;
            margin-top: 8px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #101827;
        }
        .web-url-panel.is-open .web-url-panel-content {
            display: block;
        }
        .web-url-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
            gap: 7px;
        }
        .web-url-field label {
            margin: 0 0 3px;
            font-size: 10px;
        }
        .web-url-field input {
            min-width: 0;
            font-size: 12px;
            padding: 7px 8px;
            border-radius: 6px;
        }
        .web-url-actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .web-url-action {
            border: 1px solid #3b82f6;
            border-radius: 6px;
            padding: 7px 10px;
            color: #fff;
            background: #2563eb;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
        }
        #webUrlStatus {
            color: #94a3b8;
            font-size: 10px;
        }

        /* Multi-Web Viewer */
        .multi-web-shell {
            padding: 12px;
            border: 2px solid #333;
            border-radius: 10px;
            background: var(--bg-container);
            margin-bottom: 24px;
        }
        .multi-web-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 2px 2px 12px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 12px;
        }
        .multi-web-heading h2 {
            margin: 0;
            color: #fff;
            font-size: 17px;
        }
        .multi-web-heading-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .multi-web-heading button {
            background: #1e293b;
            color: white;
            border: 1px solid #334155;
            padding: 7px 11px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 5px;
            cursor: pointer;
        }
        .multi-web-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 10px;
            align-items: stretch;
        }
        .web-preview-card {
            min-width: 0;
            overflow: hidden;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #0b1220;
        }
        .web-preview-card.is-selected {
            grid-column: 1 / -1;
            grid-row: 1;
            border: 2px solid #3b82f6;
        }
        .web-preview-card-header {
            min-height: 34px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding: 5px 8px;
            background: #172033;
            border-bottom: 1px solid #334155;
        }
        .web-preview-select {
            min-width: 0;
            border: 0;
            padding: 3px 4px;
            background: transparent;
            color: #cbd5e1;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            text-align: left;
        }
        .web-preview-card.is-selected .web-preview-select {
            color: #60a5fa;
        }
        .web-preview-address {
            min-width: 0;
            overflow: hidden;
            color: #64748b;
            font-size: 10px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .web-preview-frame-wrap {
            position: relative;
            height: 118px;
            overflow: auto;
            background: #fff;
            -webkit-overflow-scrolling: touch;
        }
        .web-preview-card.is-selected .web-preview-frame-wrap {
            height: min(68vh, 620px);
            min-height: 360px;
        }
        .web-preview-frame {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 100%;
            border: 0;
            background: #fff;
        }
        .web-preview-empty {
            padding: 30px 12px;
            color: #94a3b8;
            text-align: center;
            font-size: 13px;
        }
        .multi-web-footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }
        .multi-web-refresh-all {
            min-width: 190px;
            border: 1px solid #3b82f6;
            border-radius: 6px;
            padding: 8px 16px;
            color: #fff;
            background: #1d4ed8;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }
        .multi-web-refresh-all:hover {
            background: #2563eb;
        }
        #webRefreshStatus {
            color: #94a3b8;
            font-size: 10px;
            text-align: center;
        }
        @media (max-width: 850px) {
            .multi-web-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }
        @media (max-width: 560px) {
            .web-url-panel-content { padding: 9px; }
            .web-url-panel-heading { align-items: flex-start; flex-direction: column; }
            .web-url-actions { align-items: stretch; }
            .web-url-action { flex: 1; }
            .multi-web-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
            .web-preview-card.is-selected .web-preview-frame-wrap { height: 58vh; min-height: 300px; }
            .multi-web-heading { align-items: flex-start; }
            .multi-web-heading h2 { font-size: 15px; }
        }

    </style>
</head>
<body>

<div class="container">
    <div class="dashboard-title-row">
        <h1>Kalkulator</h1>
        <button type="button" class="web-url-toggle" id="webUrlToggle"
            onclick="toggleWebsiteSettings()" title="Pengaturan website"
            aria-label="Pengaturan website" aria-expanded="false"
            aria-controls="webUrlPanelContent">⚙</button>
        <div class="dashboard-title-actions">
            <button type="button" id="forceResetBtn" class="force-reset-btn"
                onclick="forceResetDashboard()" title="Bersihkan cache aplikasi dan muat kode terbaru"
                aria-label="Force Reset">↻ Force Reset</button>
        </div>
    </div>

    <section class="web-url-panel" id="webUrlPanel" aria-labelledby="webUrlPanelTitle">
        <div class="web-url-panel-content" id="webUrlPanelContent" hidden>
            <div class="web-url-grid">
                <div class="web-url-field">
                    <label for="webUrl1">SD/SG/HK</label>
                    <input type="url" id="webUrl1" inputmode="url">
                </div>
                <div class="web-url-field">
                    <label for="webUrl2">CAM</label>
                    <input type="url" id="webUrl2" inputmode="url">
                </div>
                <div class="web-url-field">
                    <label for="webUrl3">CHN</label>
                    <input type="url" id="webUrl3" inputmode="url">
                </div>
                <div class="web-url-field">
                    <label for="webUrl4">JPN</label>
                    <input type="url" id="webUrl4" inputmode="url">
                </div>
                <div class="web-url-field">
                    <label for="webUrl5">TWN</label>
                    <input type="url" id="webUrl5" inputmode="url">
                </div>
            </div>
            <div class="web-url-actions">
                <button type="button" class="web-url-action" onclick="applyWebsiteUrls()">TERAPKAN LINK</button>
                <span id="webUrlStatus" role="status" aria-live="polite" hidden></span>
            </div>
        </div>
    </section>

    <div>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px; margin-bottom: 5px;">
        <label for="inputData" style="margin: 0;">Angka Asli:</label>
        <button id="btnToggleInput" onclick="toggleInputData()" style="background-color: #24324d; color: #94a3b8; border: 1px solid #334155; padding: 4px 10px; font-size: 11px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: all 0.2s;">
            👁️ Unhide
        </button>
    </div>
    
    <textarea id="inputData" rows="15" readonly style="display: none;">45.54.68.86.73.37
60.06.23.32.12.21
48.84.26.62.43.34
56.65.04.40.19.91
59.95.07.70.46.64
09.90.15.51.24.42
30.03.57.75.69.96
29.92.13.31.79.97
36.63.08.80.17.71
89.98.38.83.10.01
05.50.74.47.25.52
14.41.49.94.28.82
18.81.58.85.67.76
16.61.78.87.39.93
27.72.35.53.20.02</textarea>
</div>
        
        <div>
            <div class="grid-inputs">
                <div>
                    <label for="hapusAwalan">Awalan</label>
                    <input type="text" id="hapusAwalan">
                </div>
                <div>
                    <label for="hapusAkhiran">Akhiran</label>
                    <input type="text" id="hapusAkhiran">
                </div>
                <div>
                    <label for="hapusSpesifik">Spesifik</label>
                    <input type="text" id="hapusSpesifik">
                </div>
            </div>

            <div style="display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap;">
                <button class="btn-execute" onclick="prosesAngka()" style="flex: 1; min-width: 100px;">Prosses</button>
                <button class="btn-execute" onclick="ringkasBB(4)" style="background-color: #9b59b6; padding: 14px 10px; flex: 1; min-width: 60px;">BB 4</button>
                <button class="btn-execute" onclick="ringkasBB(5)" style="background-color: #8e44ad; padding: 14px 10px; flex: 1; min-width: 60px;">BB 5</button>
                <button class="btn-execute" onclick="ringkasBB(6)" style="background-color: #2980b9; padding: 14px 10px; flex: 1; min-width: 60px;">BB 6</button>
                <button class="btn-execute" onclick="clearAllFields()" style="background-color: #64748b; padding: 14px 10px; flex: 1; min-width: 90px;">🗑️ Clear</button>
            </div>
        </div>
    </div>

    <div class="bottom-layout">
        <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <label style="margin: 0; font-size: 16px;">Hasil Akhir / Manual</label>
                <div style="display: flex; align-items: center; gap: 6px;">
                    <button type="button" onclick="bagiHasilAkhirDuaBagian()" title="Bagi BB 4 angka dan BB 3 angka menjadi 2 bagian"
                        style="background-color: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 4px 7px; font-size: 10px; font-weight: 600; border-radius: 4px; cursor: pointer; white-space: nowrap;">
                        BAGI 2
                    </button>
                    <button onclick="pasteHasilManual()" style="background-color: #1e293b; color: #3b82f6; border: 1px solid #24324d; padding: 4px 10px; font-size: 11px; font-weight: bold; border-radius: 4px; cursor: pointer;">
                        PASTE
                    </button>
                </div>
            </div>
            
            <div class="output-container">
                <!-- Atribut "readonly" telah dihapus di sini agar bisa diisi manual -->
                <textarea id="outputData"></textarea>
                <button class="btn-copy" onclick="copyHasil()" id="btnCopyText">Copy</button>
            </div>
        </div>

        <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <label style="margin: 0; font-size: 16px;">Angka Pembanding</label>
                <button onclick="pastePembanding()" style="background-color: #1e293b; color: #3b82f6; border: 1px solid #24324d; padding: 4px 10px; font-size: 11px; font-weight: bold; border-radius: 4px; cursor: pointer;">
                    PASTE
                </button>
            </div>
            <div class="match-box">
                
                <div class="match-layout">
                    <div class="match-input-side">
                        <textarea id="inputPembanding" style="height: 200px; resize: none;"></textarea>
                        
                        <button class="btn-execute" onclick="cocokkanData()" style="margin-top: 10px; background-color: #2ecc71; font-size: 14px; padding: 12px; letter-spacing: 0;">Cocokkan</button>
                    </div>

                    <div class="match-result-side">
                        
                        <div id="wrapperHasilCocok" style="display: none; flex-direction: column; gap: 15px;">
                            
                            <div id="boxDouble" style="display: none;">
                                <label style="color: #3498db; font-size: 12px; margin-bottom: 5px; display: block;">Angka Double</label>
                                <textarea id="outputDouble" readonly style="height: 50px; border: 1px solid #3498db; color: #3498db; resize: none; width: 100%; box-sizing: border-box;"></textarea>
                            </div>

                            <div id="pesanCocok" style="display: none; color: #2ecc71; font-weight: bold; text-align: center; margin-top: 10px; font-size: 14px;">
                                ✔ Semua Terverifikasi
                            </div>

                            <div id="gridPerbedaan" class="side-by-side-results" style="display: none;">
                                <div style="display: flex; flex-direction: column;">
                                    <label style="color: #e74c3c; font-size: 11px; margin-bottom: 5px;">❌ DARI HASIL ATAS ❌</label>
                                    <textarea id="outputTidakCocok" readonly style="height: 90px; border: 1px solid #e74c3c; color: #e74c3c; resize: none; width: 100%; box-sizing: border-box;"></textarea>
                                </div>

                                <div style="display: flex; flex-direction: column;">
                                    <label style="color: #f39c12; font-size: 11px; margin-bottom: 5px;">❌ DARI PEMBANDING ❌</label>
                                    <textarea id="outputBerlebih" readonly style="height: 90px; border: 1px solid #f39c12; color: #f39c12; resize: none; width: 100%; box-sizing: border-box;"></textarea>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<section class="multi-web-shell" aria-labelledby="multiWebTitle">
    <div class="multi-web-heading">
        <div>
            <h2 id="multiWebTitle">LIVE WEBSITE VIEWER</h2>
            <div id="selectedWebLabel" style="color:#94a3b8;font-size:11px;margin-top:4px;">Pilih website dari thumbnail di bawah</div>
        </div>
        <div class="multi-web-heading-actions">
            <button type="button" onclick="refreshSelectedWebsite()">↻ Refresh</button>
        </div>
    </div>
    <div id="multiWebGrid" class="multi-web-grid">

    // FILTER DATA ASLI
    function bersihkanInput(str) {
        if (!str) return [];
        return str.split('.').map(item => item.trim()).filter(item => item !== '');
    }

    function prosesAngka() {
        const inputStr = document.getElementById('inputData').value;
        const awalanArr = bersihkanInput(document.getElementById('hapusAwalan').value);
        const akhiranArr = bersihkanInput(document.getElementById('hapusAkhiran').value);
        const spesifikArr = bersihkanInput(document.getElementById('hapusSpesifik').value);

        let rawArray = inputStr.replace(/\n/g, '.').split('.');
        let numArray = rawArray.map(n => n.trim()).filter(n => n !== '');

        if (numArray.length === 0) {
            document.getElementById('outputData').value = "";
            return;
        }

        let hasil = [];

        for (let angka of numArray) {
            let harusDihapus = false;
            for (let awalan of awalanArr) {
                if (angka.startsWith(awalan)) { harusDihapus = true; break; }
            }
            if (!harusDihapus) {
                for (let akhiran of akhiranArr) {
                    if (angka.endsWith(akhiran)) { harusDihapus = true; break; }
                }
            }
            if (!harusDihapus) {
                if (spesifikArr.includes(angka)) { harusDihapus = true; }
            }
            if (!harusDihapus) { hasil.push(angka); }
        }

        let barisHasil = [];
        for (let i = 0; i < hasil.length; i += 6) {
            barisHasil.push(hasil.slice(i, i + 6).join('.'));
        }

        document.getElementById('outputData').value = barisHasil.join('\n');
        document.getElementById('btnCopyText').innerText = "Copy";
    }

    // FUNGSI UNTUK MEMECAH FORMAT "123 bb 2a X" KEMBALI JADI ANGKA SATUAN
    function parseAndExpand(str) {
        let result = [];
        let regexBB = /(\d+)\s+bb\s+(2d|2a\s*x)/gi;
        let match;
        let processedStr = str;
        
        while ((match = regexBB.exec(str)) !== null) {
            let d = match[1];
            for(let i=0; i<d.length; i++) {
                for(let j=0; j<d.length; j++) {
                    if(i !== j) result.push(d[i]+d[j]);
                }
            }
            processedStr = processedStr.replace(match[0], ' ');
        }
        
        let nums = processedStr.replace(/[\n\s,.]+/g, ' ').split(' ').filter(Boolean);
        result.push(...nums);
        return result;
    }

  function ringkasBB(bbLength = 4) {
    const outputTextArea = document.getElementById('outputData');
    let val = outputTextArea.value;
    if (!val) {
        alert("Kolom Hasil Akhir masih kosong. Silakan proses dulu atau isi manual.");
        return;
    }

    let angka2D = parseAndExpand(val); 
    angka2D = [...new Set(angka2D)].filter(n => /^\d{2}$/.test(n));

    let digits = '0123456789';
    let subsets = [];
    let f = function(prefix, str) {
        for (let i = 0; i < str.length; i++) {
            subsets.push(prefix + str[i]);
            f(prefix + str[i], str.slice(i + 1));
        }
    };
    f('', digits);
    
    subsets = subsets.filter(s => s.length === bbLength);

    let validSubsets = subsets.filter(subset => {
        let perms = [];
        for(let i=0; i<bbLength; i++) {
            for(let j=0; j<bbLength; j++) {
                if(i !== j) perms.push(subset[i]+subset[j]);
            }
        }
        return perms.every(p => angka2D.includes(p));
    });

    for (let i = validSubsets.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [validSubsets[i], validSubsets[j]] = [validSubsets[j], validSubsets[i]];
    }

    let bbGroups = [];
    let usedPerms = new Set();
    
    for (let subset of validSubsets) {
        let perms = [];
        for(let i=0; i<bbLength; i++) {
            for(let j=0; j<bbLength; j++) {
                if(i !== j) perms.push(subset[i]+subset[j]);
            }
        }
        
        let isOverlap = perms.some(p => usedPerms.has(p));
        
        if (!isOverlap) {
            bbGroups.push(subset + " bb 2a X");
            perms.forEach(p => usedPerms.add(p));
            if (bbGroups.length === 2) break; 
        }
    }
    
    angka2D = angka2D.filter(a => !usedPerms.has(a));
    
    let pairs = [];
    let singles = [];
    let processed = new Set();
    
    for (let i = 0; i < angka2D.length; i++) {
        let num = angka2D[i];
        if (processed.has(num)) continue;
        
        let rev = num[1] + num[0];
        
        if (num === rev) {
            singles.push(num);
            processed.add(num);
            continue;
        }
        
        let hasReverse = angka2D.includes(rev) && !processed.has(rev);
        if (hasReverse) {
            pairs.push([num, rev]);
            processed.add(num);
            processed.add(rev);
        } else {
            singles.push(num);
            processed.add(num);
        }
    }

    let blocks = [];
    for (let p of pairs) {
        if (Math.random() > 0.5) p = [p[1], p[0]];
        blocks.push({ type: 'pair', data: p });
    }
    for (let s of singles) {
        blocks.push({ type: 'single', data: [s] });
    }
    
    for (let i = blocks.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [blocks[i], blocks[j]] = [blocks[j], blocks[i]];
    }
    
    let finalRows = [];
    let currentRow = [];
    
    for (let i = 0; i < blocks.length; i++) {
        let b = blocks[i];
        let spaceLeft = 6 - currentRow.length;
        
        if (b.type === 'pair') {
            if (spaceLeft >= 2) {
                currentRow.push(...b.data);
            } else {
                let foundSingleIdx = -1;
                for (let j = i + 1; j < blocks.length; j++) {
                    if (blocks[j].type === 'single') {
                        foundSingleIdx = j;
                        break;
                    }
                }
                
                if (foundSingleIdx !== -1) {
                    let singleBlock = blocks.splice(foundSingleIdx, 1)[0];
                    currentRow.push(...singleBlock.data);
                    finalRows.push(currentRow);
                    currentRow = [];
                    i--; 
                } else {
                    currentRow.push(b.data[0]);
                    finalRows.push(currentRow);
                    currentRow = [b.data[1]];
                }
            }
        } else {
            currentRow.push(...b.data);
        }
        
        if (currentRow.length === 6) {
            finalRows.push(currentRow);
            currentRow = [];
        }
    }
    if (currentRow.length > 0) {
        finalRows.push(currentRow);
    }

    let finalOutput = [];
    let barisAngka = [];
    for (let row of finalRows) {
        barisAngka.push(row.join('.'));
    }

    if (barisAngka.length > 0) {
        finalOutput.push(barisAngka.join('\n'));
    }

    if (bbGroups.length > 0) {
        if (finalOutput.length > 0) finalOutput.push('---');
        finalOutput.push(bbGroups.join('\n'));
    }

    outputTextArea.value = finalOutput.join('\n');
}

        const wrapper = document.getElementById('wrapperHasilCocok');

            wrapper.style.display = 'none';
            return;
        }

        let rawPembandingArr = parseAndExpand(pembandingStr);
        
        let cekSet = new Set();
        let doubleSet = new Set();

        for (let num of rawPembandingArr) {
            if (cekSet.has(num)) {

            } else {
                cekSet.add(num);
            }
        }

        let arrDouble = Array.from(doubleSet);
        if (arrDouble.length > 0) {
            boxDouble.style.display = 'block';
            outputDouble.value = arrDouble.join(' ');
        }

        let hasilArr = parseAndExpand(hasilProsesStr);
        let pembandingUnikArr = Array.from(cekSet); 

        let tidakDitemukan = hasilArr.filter(angka => !pembandingUnikArr.includes(angka));
        let angkaBerlebih = pembandingUnikArr.filter(angka => !hasilArr.includes(angka));

        if (tidakDitemukan.length === 0 && angkaBerlebih.length === 0) {
            pesanCocok.style.display = 'block';
        } else {
            gridPerbedaan.style.display = 'grid'; 
            
            if (tidakDitemukan.length > 0) {
                outputTidakCocok.value = tidakDitemukan.join(' ');
            } else {
                outputTidakCocok.value = "-";
            }

            if (angkaBerlebih.length > 0) {
                outputBerlebih.value = angkaBerlebih.join(' ');
            } else {
                outputBerlebih.value = "-";
            }
        }
    }

// BAGI HASIL AKHIR MENJADI 2 BAGIAN TANPA MEMBUAT ANGKA BARU
function bagiHasilAkhirDuaBagian() {
    const outputTextArea = document.getElementById('outputData');
    const originalText = outputTextArea.value;

    if (!originalText.trim()) {
        alert('Kolom Hasil Akhir masih kosong.');
        return;
    }

    const lines = originalText.split(/\r?\n/);
    const bb4Lines = [];
    const bb3Lines = [];
    const otherBBDigits = [];
    const ordinaryNumbers = [];

    for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line || /^[-—]+$/.test(line)) continue;

        const bbMatch = line.match(/^(\d+)\s*bb\b/i);
        if (bbMatch) {
            const digitLength = bbMatch[1].length;
            if (digitLength === 4) {
                bb4Lines.push(line);
            } else if (digitLength === 3) {
                bb3Lines.push(line);
            } else {
                otherBBDigits.push(digitLength);
            }
            continue;
        }

        // Baca hanya angka 2D yang sudah ada; jangan membuat angka baru.
        const foundNumbers = line.split(/[\s.,]+/).filter(token => /^\d{2}$/.test(token));
        ordinaryNumbers.push(...foundNumbers);
    }

    if (otherBBDigits.length > 0) {
        alert('Ditemukan BB selain 4 angka dan 3 angka. Hasil tidak diubah agar data lain tidak hilang.');
        return;
    }

    if (bb4Lines.length !== 2) {
        alert(
            'Tombol BAGI 2 membutuhkan tepat 2 BB 4 angka. ' +
            'Saat ini ditemukan ' + bb4Lines.length + '. Hasil tidak diubah.'
        );
        return;
    }

    // Izinkan tombol ditekan kembali setelah hasil terbagi: gunakan BB3 yang sudah terbentuk.
    let selectedBB3Lines = [];
    let numbersAfterBB3 = [];

    if (bb3Lines.length === 2 && ordinaryNumbers.length === 33) {
        selectedBB3Lines = bb3Lines.slice();
        numbersAfterBB3 = ordinaryNumbers.slice();
    } else if (bb3Lines.length === 0 && ordinaryNumbers.length === 45) {
        if (new Set(ordinaryNumbers).size !== ordinaryNumbers.length) {
            alert('Ada angka biasa yang duplikat. Hasil tidak diubah agar jumlah angka tetap akurat.');
            return;
        }

        const ordinarySet = new Set(ordinaryNumbers);
        const digitSets = [];
        const digits = '0123456789';

        // Cari semua kombinasi 3 digit yang keenam pasangan bolak-baliknya
        // benar-benar tersedia di antara 45 angka biasa yang tersisa.
        function buildDigitSets(prefix, remainingDigits) {
            if (prefix.length === 3) {
                digitSets.push(prefix);
                return;
            }
            for (let i = 0; i < remainingDigits.length; i++) {
                buildDigitSets(prefix + remainingDigits[i], remainingDigits.slice(i + 1));
            }
        }
        buildDigitSets('', digits);

        const validBB3 = digitSets.map(digitSet => {
            const pairs = [];
            for (let i = 0; i < digitSet.length; i++) {
                for (let j = 0; j < digitSet.length; j++) {
                    if (i !== j) pairs.push(digitSet[i] + digitSet[j]);
                }
            }
            return { digitSet, pairs };
        }).filter(candidate => candidate.pairs.every(pair => ordinarySet.has(pair)));

        // Acak pilihan seperti fungsi BB yang sudah ada, lalu cari dua grup
        // yang tidak memakai pasangan 2D yang sama.
        for (let i = validBB3.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [validBB3[i], validBB3[j]] = [validBB3[j], validBB3[i]];
        }

        let selectedCandidates = null;
        for (let i = 0; i < validBB3.length && !selectedCandidates; i++) {
            const firstPairs = new Set(validBB3[i].pairs);
            for (let j = i + 1; j < validBB3.length; j++) {
                if (validBB3[j].pairs.every(pair => !firstPairs.has(pair))) {
                    selectedCandidates = [validBB3[i], validBB3[j]];
                    break;
                }
            }
        }

        if (!selectedCandidates) {
            alert('Tidak ditemukan 2 kombinasi BB 3 angka yang valid dan tidak saling bertumpuk dari 45 angka tersisa. Hasil tidak diubah.');
            return;
        }

        const bb3CoveredPairs = new Set();
        selectedCandidates.forEach(candidate => {
            candidate.pairs.forEach(pair => bb3CoveredPairs.add(pair));
            selectedBB3Lines.push(candidate.digitSet + ' bb 2a X');
        });

        // Enam pasangan untuk setiap BB3 dipindahkan dari angka biasa ke notasi BB3.
        numbersAfterBB3 = ordinaryNumbers.filter(number => !bb3CoveredPairs.has(number));

        if (numbersAfterBB3.length !== 33 || bb3CoveredPairs.size !== 12) {
            alert('Pemeriksaan jumlah angka tidak cocok. Hasil tidak diubah agar tidak ada data yang hilang.');
            return;
        }
    } else {
        alert(
            'Format sumber belum sesuai. Gunakan BB 4 terlebih dahulu, sehingga hasil berisi ' +
            '2 BB 4 angka dan 45 angka biasa. Jika sudah pernah dibagi, hasil harus berisi ' +
            '2 BB 4 angka, 2 BB 3 angka, dan 33 angka biasa. ' +
            'Saat ini ditemukan BB 4: ' + bb4Lines.length +
            ', BB 3: ' + bb3Lines.length +
            ', angka biasa: ' + ordinaryNumbers.length + '.'
        );
        return;
    }

    if (numbersAfterBB3.length !== 33 || selectedBB3Lines.length !== 2) {
        alert('Jumlah akhir tidak sesuai target 69 angka. Hasil tidak diubah.');
        return;
    }

    function groupIntoSix(numbers) {
        const rows = [];
        for (let i = 0; i < numbers.length; i += 6) {
            rows.push(numbers.slice(i, i + 6).join('.'));
        }
        return rows;
    }

    // 33 angka biasa dibagi menjadi 23 di bagian pertama dan 10 di bagian kedua.
    const firstPartNumbers = numbersAfterBB3.slice(0, 23);
    const secondPartNumbers = numbersAfterBB3.slice(23);

    const firstPart = [
        ...groupIntoSix(firstPartNumbers), // 6, 6, 6, 5 angka
        bb4Lines[0],
        selectedBB3Lines[0]
    ];
    const secondPart = [
        bb4Lines[1],
        selectedBB3Lines[1],
        ...groupIntoSix(secondPartNumbers) // 6, 4 angka
    ];

    outputTextArea.value = firstPart.join('\n') + '\n---\n' + secondPart.join('\n');
    document.getElementById('btnCopyText').innerText = 'Copy';
}

const DASHBOARD_WEB_URLS_KEY = 'dashboard1_web_urls_v1';
const DEFAULT_DASHBOARD_WEB_URLS = ['https://toto.sdy2024.com', '', '', '', ''];
const DASHBOARD_WEB_LABELS = [
    'SD/SG/HK',
    'CAM',
    'CHN',
    'JPN',
    'TWN'
];
let selectedDashboardWebIndex = 0;

function normalizeWebsiteUrl(value) {
    const raw = String(value || '').trim();
    if (!raw) return '';
    const candidate = /^https?:\/\//i.test(raw) ? raw : 'https://' + raw;
    let parsed;
    try {
        parsed = new URL(candidate);
    } catch (error) {
        throw new Error('Format URL tidak valid: ' + raw);
    }
    if (!['http:', 'https:'].includes(parsed.protocol)) {
        throw new Error('Link harus menggunakan http:// atau https://');
    }
    return parsed.href;
}

function getWebsiteUrlInputs() {
    return Array.from({ length: 5 }, (_, index) => {
        const input = document.getElementById('webUrl' + (index + 1));
        return input ? input.value.trim() : '';
    });
}

function loadSavedWebsiteUrls() {
    let urls = DEFAULT_DASHBOARD_WEB_URLS.slice();
    try {
        const saved = JSON.parse(localStorage.getItem(DASHBOARD_WEB_URLS_KEY) || 'null');
        if (Array.isArray(saved)) {
            urls = Array.from({ length: 5 }, (_, index) => String(saved[index] || ''));
        }
    } catch (error) {
        console.warn('Pengaturan URL website tidak dapat dibaca:', error);
    }
    urls.forEach((url, index) => {
        const input = document.getElementById('webUrl' + (index + 1));
        if (input) input.value = url;
    });
    return urls;
}

    const status = document.getElementById('webUrlStatus');

    const urls = [];

                urls[index] = '';
                return;
            }
            urls[index] = normalizeWebsiteUrl(raw);
        });
    } catch (error) {
        status.textContent = error.message;
        status.style.color = '#f87171';
        return;
    }

    const activeUrls = urls.map((url, index) => ({ url, index })).filter(item => item.url);
    if (!activeUrls.length) {
        status.textContent = 'Masukkan minimal satu link website.';
        status.style.color = '#f87171';
        return;
    }

    try {
        localStorage.setItem(DASHBOARD_WEB_URLS_KEY, JSON.stringify(urls));
    } catch (error) {
        console.warn('URL tidak dapat disimpan di browser:', error);
    }

    renderDashboardWebsites(activeUrls);
    status.textContent = activeUrls.length + ' website diterapkan dan disimpan di browser ini.';
    status.style.color = '#34d399';
}


function renderDashboardWebsites(items) {
    const grid = document.getElementById('multiWebGrid');
    if (!grid) return;
    grid.replaceChildren();

    if (!items.length) {
        grid.innerHTML = '<div class="web-preview-empty">Belum ada website yang ditambahkan.</div>';
        return;
    }

    const selectedExists = items.some(item => item.index === selectedDashboardWebIndex);
    if (!selectedExists) selectedDashboardWebIndex = items[0].index;

    items.forEach(item => {
        const card = document.createElement('article');
        card.className = 'web-preview-card' + (item.index === selectedDashboardWebIndex ? ' is-selected' : '');
        card.dataset.webIndex = String(item.index);

        const header = document.createElement('div');
        header.className = 'web-preview-card-header';

        const selectButton = document.createElement('button');
        selectButton.type = 'button';
        selectButton.className = 'web-preview-select';
        selectButton.textContent = DASHBOARD_WEB_LABELS[item.index] || ('WEB ' + (item.index + 1));
        selectButton.setAttribute('aria-pressed', item.index === selectedDashboardWebIndex ? 'true' : 'false');
        selectButton.addEventListener('click', () => selectDashboardWebsite(item.index));

        header.append(selectButton);

        const frameWrap = document.createElement('div');
        frameWrap.className = 'web-preview-frame-wrap';

        const frame = document.createElement('iframe');
        frame.className = 'web-preview-frame';
        frame.dataset.originalUrl = item.url;
        frame.src = buildFreshWebsiteUrl(item.url, Date.now() + '-' + item.index);
        frame.title = 'Pratinjau WEB ' + (item.index + 1);
        frame.loading = 'eager';
        frame.referrerPolicy = 'strict-origin-when-cross-origin';
        frame.setAttribute('allow', 'fullscreen');
        frameWrap.appendChild(frame);

        card.append(header, frameWrap);
        grid.appendChild(card);
    });

    updateSelectedWebsiteLabel();
}

function selectDashboardWebsite(index) {
    selectedDashboardWebIndex = index;
    document.querySelectorAll('.web-preview-card').forEach(card => {
        const selected = Number(card.dataset.webIndex) === index;
        card.classList.toggle('is-selected', selected);
        const button = card.querySelector('.web-preview-select');
        if (button) button.setAttribute('aria-pressed', selected ? 'true' : 'false');
    });
    updateSelectedWebsiteLabel();
}

function updateSelectedWebsiteLabel() {
    const label = document.getElementById('selectedWebLabel');
    const card = document.querySelector('.web-preview-card.is-selected');
    if (!label) return;
    if (!card) {
        label.textContent = 'Pilih website dari thumbnail di bawah';
        return;
    }
    const index = Number(card.dataset.webIndex);
    label.textContent = DASHBOARD_WEB_LABELS[index] || ('WEB ' + (index + 1));
}

// Tambahkan token pada URL agar browser meminta dokumen website terbaru.
function buildFreshWebsiteUrl(rawUrl, token) {
    const freshUrl = new URL(rawUrl);
    freshUrl.searchParams.set('_dashboard_refresh', String(token));
    return freshUrl.href;
}

function reloadWebsiteFrame(frame, token) {
    if (!frame) return;
    const originalUrl = frame.dataset.originalUrl || frame.src;
    if (!originalUrl || originalUrl === 'about:blank') return;

    frame.src = 'about:blank';
    window.setTimeout(() => {
        frame.src = buildFreshWebsiteUrl(originalUrl, token);
    }, 30);
}

function refreshSelectedWebsite() {
    const card = document.querySelector('.web-preview-card.is-selected');
    const frame = card ? card.querySelector('iframe') : null;
    if (!frame) {
        const status = document.getElementById('webUrlStatus');
        status.textContent = 'Belum ada website yang dipilih.';
        status.style.color = '#fbbf24';
        return;
    }
    reloadWebsiteFrame(frame, Date.now());
}

function refreshAllWebsites() {
    const frames = Array.from(document.querySelectorAll('#multiWebGrid .web-preview-frame'));
    const status = document.getElementById('webRefreshStatus');

    if (!frames.length) {
        if (status) status.textContent = 'Belum ada website yang dapat diperbarui.';
        return;
    }

    const refreshToken = Date.now();
    frames.forEach((frame, index) => {
        reloadWebsiteFrame(frame, refreshToken + '-' + index);
    });

    if (status) {
        status.textContent = 'Permintaan refresh dikirim ke ' + frames.length + ' website.';
    }
}

(function initializeDashboardWebsites() {
    const urls = loadSavedWebsiteUrls();
    const entries = urls
        .map((raw, index) => ({ raw, index }))
        .filter(item => item.raw.trim())
        .map(item => ({ url: normalizeWebsiteUrl(item.raw), index: item.index }));
    if (entries.length) renderDashboardWebsites(entries);
})();

</script>
