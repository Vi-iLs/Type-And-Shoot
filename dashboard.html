<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Kalkulator Invest</title>
    <style>
        :root {
            --bg-main: #0b0f19;       /* Dark slate biru premium */
            --bg-container: #151f32;  /* Kontainer sedikit lebih terang */
            --text-color: #f8fafc;     /* Putih pudar agar nyaman di mata */
            --border-color: #24324d;   /* Border tipis kebiruan */
            --input-bg: #1d293e;       /* Background input yang kontras */
            --button-color: #3b82f6;   /* Biru modern */
            --button-hover: #2563eb;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-color);
            max-width: 950px;
            margin: 0 auto;
            padding: 15px;
        }

        .container {
            background-color: var(--bg-container);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            margin-bottom: 30px; 
        }

        .dashboard-title-row {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 0 25px;
            padding: 0 0 15px;
            border-bottom: 1px solid var(--border-color);
            min-height: 27px;
        }

        .dashboard-title-row h1 {
            color: var(--text-color);
            text-align: center;
            border: 0;
            padding: 0;
            margin: 0;
            width: 100%;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .dashboard-title-actions {
            position: absolute;
            top: 0;
            right: 0;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .web-url-toggle {
            position: absolute;
            top: 0;
            left: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 27px;
            height: 27px;
            padding: 0;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #101827;
            color: #94a3b8;
            font-size: 17px;
            line-height: 1;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s, background 0.2s;
        }

        .web-url-toggle:hover,
        .web-url-toggle:focus-visible {
            color: var(--text-color);
            border-color: #3b82f6;
            outline: none;
        }

        .force-reset-btn {
            position: static;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 5px 7px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: transparent;
            color: #94a3b8;
            font-size: 10px;
            font-weight: 500;
            line-height: 1;
            cursor: pointer;
            opacity: 0.72;
            transition: opacity 0.2s, border-color 0.2s, color 0.2s;
        }

        .force-reset-btn:hover,
        .force-reset-btn:focus-visible {
            opacity: 1;
            color: var(--text-color);
            border-color: #64748b;
            outline: none;
        }

        .force-reset-btn:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        label {
            font-weight: 500;
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            color: #94a3b8;
            font-size: 14px;
        }

        textarea, input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;       
            box-sizing: border-box;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 16px; /* Update anti-zoom di iOS */
            background-color: var(--input-bg);
            color: var(--text-color);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--button-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        #inputData {
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            resize: vertical;
            height: 180px;
            padding: 10px;
            font-size: 16px; 
            letter-spacing: 0.5px;
            line-height: 1.5;
            overflow-y: auto;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 2fr;
            gap: 15px;
        }

        button.btn-execute {
            background-color: var(--button-color);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button.btn-execute:hover {
            background-color: var(--button-hover);
            transform: translateY(-1px);
        }

        button.btn-execute:active {
            transform: translateY(1px);
        }

        .bottom-layout {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .output-container {
            position: relative;
            width: 100%;
        }

        #outputData {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: #34d399;
            font-weight: bold;
            padding-right: 68px;
            resize: vertical;
            height: 170px;
            font-size: 13.6px;
            line-height: 1.36;
            overflow-y: auto;
        }

        button.btn-copy {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: #1e293b;
            color: white;
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            font-size: 10.2px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.btn-copy:hover {
            background-color: #334155;
        }

        .match-box {
            background-color: #0f172a;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            min-height: 272px;
        }
        .match-box textarea {
            padding: 10px;
            font-size: 13.6px;
            line-height: 1.36;
        }

        .match-layout {
            display: flex;
            flex-direction: column;
            gap: 17px;
        }

        .side-by-side-results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 13px;
        }

        /* GAYA UNTUK TOMBOL NAVIGASI MELAYANG (FLOATING BUTTONS) */
        .floating-nav {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 9999;
        }

        .nav-btn {
            background-color: #1e293b;
            color: #3b82f6;
            border: 2px solid #24324d;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: all 0.2s;
            opacity: 0.8;
        }

        .nav-btn:hover, .nav-btn:active {
            opacity: 1;
            background-color: #3b82f6;
            color: white;
            transform: scale(1.05);
        }

        @media (min-width: 768px) {
            .main-layout {
                display: grid;
                grid-template-columns: 1fr 1.2fr;
                gap: 25px;
            }
            .bottom-layout {
                display: grid;
                grid-template-columns: 1fr 1.3fr;
                gap: 25px;
            }
            #inputData { height: 340px; }
            #outputData { height: 289px; }
            
            .match-layout {
                display: grid;
                grid-template-columns: 1fr 1.2fr;
            }
            
            /* Sembunyikan tombol navigasi jika di layar besar/PC */
            .floating-nav { display: none; }
        }
    
        /* Pengaturan URL website: ringkas dan tertutup secara default */
        .web-url-panel {
            margin: 0 0 14px;
            padding: 0;
            border: 0;
            background: transparent;
        }
        .web-url-panel-content {
            display: none;
            max-width: 100%;
            margin-top: 8px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #101827;
        }
        .web-url-panel.is-open .web-url-panel-content {
            display: block;
        }
        .web-url-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
            gap: 7px;
        }
        .web-url-field label {
            margin: 0 0 3px;
            font-size: 10px;
        }
        .web-url-field input {
            min-width: 0;
            font-size: 12px;
            padding: 7px 8px;
            border-radius: 6px;
        }
        .web-url-actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .web-url-action {
            border: 1px solid #3b82f6;
            border-radius: 6px;
            padding: 7px 10px;
            color: #fff;
            background: #2563eb;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
        }
        #webUrlStatus {
            color: #94a3b8;
            font-size: 10px;
        }

        /* Single Website Viewer */
        .web-viewer-shell {
            margin-top: 18px;
            padding: 10px;
            border: 2px solid #333;
            border-radius: 10px;
            background: var(--bg-container);
            margin-bottom: 24px;
        }
        .web-viewer-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 2px 2px 12px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 12px;
        }
        .web-viewer-heading h2 {
            margin: 0;
            color: #fff;
            font-size: 14.5px;
        }
        .web-viewer-label {
            margin-top: 4px;
            color: #94a3b8;
            font-size: 9.4px;
        }
        .web-viewer-heading button {
            flex: 0 0 auto;
            background: #1e293b;
            color: white;
            border: 1px solid #334155;
            padding: 6px 9px;
            font-size: 10.2px;
            font-weight: 700;
            border-radius: 5px;
            cursor: pointer;
        }
        .web-viewer-frame-wrap {
            --website-scale: 1;
            position: relative;
            width: calc(100% - 12px);
            height: min(58vh, 527px);
            min-height: 306px;
            margin: 0 6px;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            background: #fff;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
        }
        .web-viewer-frame {
            display: block;
            width: 380px;
            height: 1500px;
            max-width: none;
            border: 0;
            background: #fff;
            transform: scale(var(--website-scale));
            transform-origin: top left;
        }
        .web-viewer-footer {
            display: flex;
            justify-content: center;
            margin-top: 10px;
            padding-top: 9px;
            border-top: 1px solid var(--border-color);
        }
        #webRefreshStatus {
            color: #94a3b8;
            font-size: 10px;
            text-align: center;
        }

        /* Dashboard data input and 30-day history */
        .data-entry-panel { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border-color); }
        .data-entry-title { margin-bottom: 7px; color: #e2e8f0; font-size: 11px; font-weight: 800; letter-spacing: .35px; }
        .data-entry-form { display: flex; align-items: stretch; gap: 7px; }
        .data-entry-form input {
            flex: 1 1 auto; min-width: 0; padding: 9px 10px; border: 1px solid var(--border-color);
            border-radius: 6px; background: var(--input-bg); color: var(--text-color);
            font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 16px; text-transform: uppercase;
        }
        .data-entry-form input:focus { outline: none; border-color: var(--button-color); box-shadow: 0 0 0 2px rgba(59, 130, 246, .18); }
        .data-entry-form button { flex: 0 0 auto; min-width: 94px; }
        #dataEntryStatus { display: block; min-height: 14px; margin-top: 6px; color: #94a3b8; font-size: 10px; }

        .data-history-shell { margin: 0 0 24px; padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; background: var(--bg-container); }
        .data-history-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
        .data-history-heading h2 { margin: 0; color: #fff; font-size: 16px; }
        .data-history-refresh {
            flex: 0 0 auto; padding: 7px 10px; border: 1px solid #334155; border-radius: 5px;
            background: #1e293b; color: #fff; font-size: 11px; font-weight: 700; cursor: pointer;
        }
        .data-history-actions { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
        .data-history-filter {
            padding: 7px 9px; border: 1px solid #475569; border-radius: 5px;
            background: #1e293b; color: #cbd5e1; font-size: 10px; font-weight: 800;
            letter-spacing: .25px; cursor: pointer; white-space: nowrap;
        }
        .data-history-filter[aria-pressed="true"] {
            border-color: #60a5fa; background: #1d4ed8; color: #fff;
            box-shadow: 0 0 8px rgba(59, 130, 246, .3);
        }
        .data-history-filter:disabled { opacity: .42; cursor: not-allowed; }
        .data-history-filter-status {
            display: block; min-height: 13px; margin: -3px 0 9px;
            color: #94a3b8; font-size: 9.5px; line-height: 1.35;
        }
        .data-history-table tbody tr.is-filter-hidden { display: none !important; }
        .data-history-table .data-value-suffix.is-filter-muted {
            color: #64748b !important; background: rgba(71, 85, 105, .20) !important;
            border-color: #475569 !important; box-shadow: none !important;
            text-shadow: none !important; opacity: .72;
        }
        .data-history-table .data-value-suffix.is-filter-highlighted {
            color: #ecfdf5; background: rgba(16, 185, 129, .20);
            border-color: #34d399; box-shadow: 0 0 6px rgba(16, 185, 129, .55);
            text-shadow: 0 0 5px rgba(52, 211, 153, .8);
        }
        .data-history-table-wrap { width: 100%; overflow-x: hidden; border: 1px solid var(--border-color); border-radius: 7px; }
        .data-history-table { width: 100%; min-width: 0; border-collapse: separate; border-spacing: 0; table-layout: fixed; font-variant-numeric: tabular-nums; }
        .data-history-table th, .data-history-table td { padding: 7px 3px; border-right: 1px solid #27364e; border-bottom: 1px solid #27364e; text-align: center; white-space: nowrap; }
        .data-history-table th:first-child, .data-history-table td:first-child { width: 66px; text-align: center; padding-left: 1px; padding-right: 1px; }
        .data-history-table th:last-child, .data-history-table td:last-child { border-right: 0; }
        .data-history-table tbody tr:last-child td { border-bottom: 0; }
        .data-history-table thead th { position: sticky; top: 0; z-index: 1; background: #101827; font-size: 10px; }
        .data-category-button { width: 100%; padding: 5px 2px; border: 1px solid transparent; border-radius: 5px; background: transparent; font-size: 11px; font-weight: 900; cursor: pointer; }
        .data-category-button[data-category="CAM"] { color: #f87171; }
        .data-category-button[data-category="CHN"] { color: #60a5fa; }
        .data-category-button[data-category="JPN"] { color: #facc15; }
        .data-category-button[data-category="TWN"] { color: #c084fc; }
        .data-category-button[aria-pressed="true"] { border-color: currentColor; background: rgba(148, 163, 184, .10); box-shadow: 0 0 0 1px currentColor; }
        .data-history-table tbody td { color: #e2e8f0; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; font-weight: 700; }
        .data-history-table tbody td:first-child { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 8.5px; font-weight: 600; }
        .data-value-prefix { font-size: 1em; }
        .data-value-suffix { display: inline-block; font-size: 1.10em; line-height: 1.1; border: 1px solid transparent; border-radius: 4px; padding: 0 1px; }
        .data-date-button { padding: 3px 1px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: #94a3b8; font-size: 8.5px; font-weight: 700; letter-spacing: -.2px; white-space: nowrap; cursor: pointer; }
        .data-date-button[aria-pressed="true"] { border-color: #94a3b8; background: rgba(148, 163, 184, .16); color: #fff; }
        .data-history-table td.is-empty { color: #64748b; font-weight: 400; }

        /* Fokus kategori: border dan glow kuat hanya pada dua digit terakhir. */
        .data-history-table[data-focus-column="CAM"] tbody td[data-category="CAM"] .data-value-suffix {
            color: #fff1f2; background: rgba(239, 68, 68, .20); border-color: #fb7185;
            box-shadow: 0 0 4px #ef4444, 0 0 9px rgba(239, 68, 68, .95), 0 0 17px rgba(239, 68, 68, .8);
            text-shadow: 0 0 4px #fff, 0 0 9px #fb7185, 0 0 14px #ef4444;
        }
        .data-history-table[data-focus-column="CHN"] tbody td[data-category="CHN"] .data-value-suffix {
            color: #eff6ff; background: rgba(59, 130, 246, .22); border-color: #60a5fa;
            box-shadow: 0 0 4px #3b82f6, 0 0 9px rgba(59, 130, 246, .95), 0 0 17px rgba(59, 130, 246, .8);
            text-shadow: 0 0 4px #fff, 0 0 9px #60a5fa, 0 0 14px #3b82f6;
        }
        .data-history-table[data-focus-column="JPN"] tbody td[data-category="JPN"] .data-value-suffix {
            color: #fefce8; background: rgba(234, 179, 8, .22); border-color: #facc15;
            box-shadow: 0 0 4px #eab308, 0 0 9px rgba(234, 179, 8, .95), 0 0 17px rgba(234, 179, 8, .8);
            text-shadow: 0 0 4px #fff, 0 0 9px #facc15, 0 0 14px #eab308;
        }
        .data-history-table[data-focus-column="TWN"] tbody td[data-category="TWN"] .data-value-suffix {
            color: #faf5ff; background: rgba(168, 85, 247, .22); border-color: #c084fc;
            box-shadow: 0 0 4px #a855f7, 0 0 9px rgba(168, 85, 247, .95), 0 0 17px rgba(168, 85, 247, .8);
            text-shadow: 0 0 4px #fff, 0 0 9px #c084fc, 0 0 14px #a855f7;
        }

        /* Pilihan tanggal: border dan glow lebih tegas pada dua digit terakhir di empat kolom. */
        .data-history-table .data-row.is-selected td[data-category="CAM"] .data-value-suffix {
            color: #fff1f2; background: rgba(239, 68, 68, .22); border-color: #fb7185;
            box-shadow: 0 0 5px #ef4444, 0 0 11px rgba(239, 68, 68, .95), 0 0 18px rgba(239, 68, 68, .8);
            text-shadow: 0 0 4px #fff, 0 0 9px #fb7185;
        }
        .data-history-table .data-row.is-selected td[data-category="CHN"] .data-value-suffix {
            color: #eff6ff; background: rgba(59, 130, 246, .24); border-color: #60a5fa;
            box-shadow: 0 0 5px #3b82f6, 0 0 11px rgba(59, 130, 246, .95), 0 0 18px rgba(59, 130, 246, .8);
            text-shadow: 0 0 4px #fff, 0 0 9px #60a5fa;
        }
        .data-history-table .data-row.is-selected td[data-category="JPN"] .data-value-suffix {
            color: #fefce8; background: rgba(234, 179, 8, .24); border-color: #facc15;
            box-shadow: 0 0 5px #eab308, 0 0 11px rgba(234, 179, 8, .95), 0 0 18px rgba(234, 179, 8, .8);
            text-shadow: 0 0 4px #fff, 0 0 9px #facc15;
        }
        .data-history-table .data-row.is-selected td[data-category="TWN"] .data-value-suffix {
            color: #faf5ff; background: rgba(168, 85, 247, .24); border-color: #c084fc;
            box-shadow: 0 0 5px #a855f7, 0 0 11px rgba(168, 85, 247, .95), 0 0 18px rgba(168, 85, 247, .8);
            text-shadow: 0 0 4px #fff, 0 0 9px #c084fc;
        }
        .data-history-empty {
            padding: 22px 10px !important; color: #94a3b8 !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
            font-size: 12px !important; font-weight: 500 !important; text-align: center !important;
        }
        .data-row.is-hidden-by-limit { display: none; }
        .data-history-more-wrap { display: flex; justify-content: center; margin-top: 10px; }
        .data-history-more {
            min-width: 112px;
            padding: 7px 15px;
            border: 1px solid #3b82f6;
            border-radius: 6px;
            background: #172b49;
            color: #bfdbfe;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .45px;
            cursor: pointer;
        }
        .data-history-more:hover { background: #1e3a5f; border-color: #60a5fa; }
        .data-history-more[hidden] { display: none !important; }
        #dataHistoryStatus { display: block; min-height: 14px; margin-top: 8px; color: #94a3b8; font-size: 10px; text-align: center; }
        @media (max-width: 560px) {
            .web-url-panel-content { padding: 9px; }
            .web-url-panel-heading { align-items: flex-start; flex-direction: column; }
            .web-url-actions { align-items: stretch; }
            .web-url-action { flex: 1; }
            .web-viewer-heading { align-items: flex-start; }
            .web-viewer-heading h2 { font-size: 12.75px; }
            .web-viewer-frame-wrap { height: 49vh; min-height: 255px; }
            .data-history-shell { padding: 8px; }
            .data-history-heading { gap: 5px; }
            .data-history-heading h2 { font-size: 13px; }
            .data-history-refresh { padding: 6px 7px; font-size: 9px; }
            .data-history-actions { gap: 4px; }
            .data-history-filter { padding: 6px 7px; font-size: 8.5px; }
            .data-history-filter-status { font-size: 8.5px; }
            .data-history-table th, .data-history-table td { padding: 6px 2px; }

<script>
    // Bersihkan parameter cache-buster setelah versi terbaru selesai dimuat.
    (function cleanForceResetQuery() {
        const currentUrl = new URL(window.location.href);
        if (currentUrl.searchParams.has('_forceReset')) {
            currentUrl.searchParams.delete('_forceReset');
            const cleanUrl = currentUrl.pathname + currentUrl.search + currentUrl.hash;
            window.history.replaceState(null, document.title, cleanUrl);
        }
    })();

    async function forceResetDashboard() {
        const confirmed = window.confirm(
            'Force Reset akan membersihkan cache aplikasi dan memuat ulang kode terbaru. Semua input serta hasil sementara di halaman ini akan hilang. Lanjutkan?'
        );
        if (!confirmed) return;

        const button = document.getElementById('forceResetBtn');
        if (button) {
            button.disabled = true;
            button.textContent = '↻ Memuat...';
        }

        try {
            if ('caches' in window) {
                const cacheNames = await caches.keys();
                const appCaches = cacheNames.filter(name =>
                    name === 'splitter-pro-v2' || name.startsWith('splitter-pro-')
                );
                await Promise.all(appCaches.map(name => caches.delete(name)));
            }
        } catch (error) {
            // Lanjutkan dengan URL unik jika Cache Storage tidak tersedia.
            console.warn('Cache aplikasi tidak dapat dibersihkan sepenuhnya:', error);
        }

        const refreshUrl = new URL(window.location.href);
        refreshUrl.searchParams.set('_forceReset', String(Date.now()));
        window.location.replace(refreshUrl.toString());
    }

    // FILTER DATA ASLI
    function bersihkanInput(str) {
        if (!str) return [];
        return str.split('.').map(item => item.trim()).filter(item => item !== '');
    }

    function prosesAngka() {
        const inputStr = document.getElementById('inputData').value;
        const awalanArr = bersihkanInput(document.getElementById('hapusAwalan').value);
        const akhiranArr = bersihkanInput(document.getElementById('hapusAkhiran').value);
        const spesifikArr = bersihkanInput(document.getElementById('hapusSpesifik').value);

        let rawArray = inputStr.replace(/\n/g, '.').split('.');
        let numArray = rawArray.map(n => n.trim()).filter(n => n !== '');

        if (numArray.length === 0) {
            document.getElementById('outputData').value = "";
            return;
        }

        let hasil = [];

        for (let angka of numArray) {
            let harusDihapus = false;
            for (let awalan of awalanArr) {
                if (angka.startsWith(awalan)) { harusDihapus = true; break; }
            }
            if (!harusDihapus) {
                for (let akhiran of akhiranArr) {
                    if (angka.endsWith(akhiran)) { harusDihapus = true; break; }
                }
            }
            if (!harusDihapus) {
                if (spesifikArr.includes(angka)) { harusDihapus = true; }
            }
            if (!harusDihapus) { hasil.push(angka); }
        }

        let barisHasil = [];
        for (let i = 0; i < hasil.length; i += 6) {
            barisHasil.push(hasil.slice(i, i + 6).join('.'));
        }

        document.getElementById('outputData').value = barisHasil.join('\n');
        document.getElementById('btnCopyText').innerText = "Copy";
    }

    // FUNGSI UNTUK MEMECAH FORMAT "123 bb 2a X" KEMBALI JADI ANGKA SATUAN
    function parseAndExpand(str) {
        let result = [];
        let regexBB = /(\d+)\s+bb\s+(2d|2a\s*x)/gi;
        let match;
        let processedStr = str;
        
        while ((match = regexBB.exec(str)) !== null) {
            let d = match[1];
            for(let i=0; i<d.length; i++) {
                for(let j=0; j<d.length; j++) {
                    if(i !== j) result.push(d[i]+d[j]);
                }
            }
            processedStr = processedStr.replace(match[0], ' ');
        }
        
        let nums = processedStr.replace(/[\n\s,.]+/g, ' ').split(' ').filter(Boolean);
        result.push(...nums);
        return result;
    }

  function ringkasBB(bbLength = 4) {
    const outputTextArea = document.getElementById('outputData');
    let val = outputTextArea.value;
    if (!val) {
        alert("Kolom Hasil Akhir masih kosong. Silakan proses dulu atau isi manual.");
        return;
    }

    let angka2D = parseAndExpand(val); 
    angka2D = [...new Set(angka2D)].filter(n => /^\d{2}$/.test(n));

    let digits = '0123456789';
    let subsets = [];
    let f = function(prefix, str) {
        for (let i = 0; i < str.length; i++) {
            subsets.push(prefix + str[i]);
            f(prefix + str[i], str.slice(i + 1));
        }
    };
    f('', digits);
    
    subsets = subsets.filter(s => s.length === bbLength);

    let validSubsets = subsets.filter(subset => {
        let perms = [];
        for(let i=0; i<bbLength; i++) {
            for(let j=0; j<bbLength; j++) {
                if(i !== j) perms.push(subset[i]+subset[j]);
            }
        }
        return perms.every(p => angka2D.includes(p));
    });

    for (let i = validSubsets.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [validSubsets[i], validSubsets[j]] = [validSubsets[j], validSubsets[i]];
    }

    let bbGroups = [];
    let usedPerms = new Set();
    
    for (let subset of validSubsets) {
        let perms = [];
        for(let i=0; i<bbLength; i++) {
            for(let j=0; j<bbLength; j++) {
                if(i !== j) perms.push(subset[i]+subset[j]);
            }
        }
        
        let isOverlap = perms.some(p => usedPerms.has(p));
        
        if (!isOverlap) {
            bbGroups.push(subset + " bb 2a X");
            perms.forEach(p => usedPerms.add(p));
            if (bbGroups.length === 2) break; 
        }
    }
    
    angka2D = angka2D.filter(a => !usedPerms.has(a));
    
    let pairs = [];
    let singles = [];
    let processed = new Set();
    
    for (let i = 0; i < angka2D.length; i++) {
        let num = angka2D[i];
        if (processed.has(num)) continue;
        
        let rev = num[1] + num[0];
        
        if (num === rev) {
            singles.push(num);
            processed.add(num);
            continue;
        }
        
        let hasReverse = angka2D.includes(rev) && !processed.has(rev);
        if (hasReverse) {
            pairs.push([num, rev]);
            processed.add(num);
            processed.add(rev);
        } else {
            singles.push(num);
            processed.add(num);
        }
    }

    let blocks = [];
    for (let p of pairs) {
        if (Math.random() > 0.5) p = [p[1], p[0]];
        blocks.push({ type: 'pair', data: p });
    }
    for (let s of singles) {
        blocks.push({ type: 'single', data: [s] });
    }
    
    for (let i = blocks.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [blocks[i], blocks[j]] = [blocks[j], blocks[i]];
    }
    
    let finalRows = [];
    let currentRow = [];
    
    for (let i = 0; i < blocks.length; i++) {
        let b = blocks[i];
        let spaceLeft = 6 - currentRow.length;
        
        if (b.type === 'pair') {
            if (spaceLeft >= 2) {
                currentRow.push(...b.data);
            } else {
                let foundSingleIdx = -1;
                for (let j = i + 1; j < blocks.length; j++) {
                    if (blocks[j].type === 'single') {
                        foundSingleIdx = j;
                        break;
                    }
                }
                
                if (foundSingleIdx !== -1) {
                    let singleBlock = blocks.splice(foundSingleIdx, 1)[0];
                    currentRow.push(...singleBlock.data);
                    finalRows.push(currentRow);
                    currentRow = [];
                    i--; 
                } else {
                    currentRow.push(b.data[0]);
                    finalRows.push(currentRow);
                    currentRow = [b.data[1]];
                }
            }
        } else {
            currentRow.push(...b.data);
        }
        
        if (currentRow.length === 6) {
            finalRows.push(currentRow);
            currentRow = [];
        }
    }
    if (currentRow.length > 0) {
        finalRows.push(currentRow);
    }

    let finalOutput = [];
    let barisAngka = [];
    for (let row of finalRows) {
        barisAngka.push(row.join('.'));
    }

    if (barisAngka.length > 0) {
        finalOutput.push(barisAngka.join('\n'));
    }

    if (bbGroups.length > 0) {
        if (finalOutput.length > 0) finalOutput.push('---');
        finalOutput.push(bbGroups.join('\n'));
    }

    outputTextArea.value = finalOutput.join('\n');
}

    function copyHasil() {
        const outputTextArea = document.getElementById('outputData');
        if (!outputTextArea.value) return;

        outputTextArea.select();
        outputTextArea.setSelectionRange(0, 99999);

        navigator.clipboard.writeText(outputTextArea.value).then(() => {
            const btnCopy = document.getElementById('btnCopyText');
            btnCopy.innerText = "Copied!";
            setTimeout(() => {
                btnCopy.innerText = "Copy";
            }, 2000);
        });
    }

    // FUNGSI PENCOCOK DATA
    function cocokkanData() {
        const hasilProsesStr = document.getElementById('outputData').value;
        const pembandingStr = document.getElementById('inputPembanding').value;
        
        const wrapper = document.getElementById('wrapperHasilCocok');
        const boxDouble = document.getElementById('boxDouble');
        const outputDouble = document.getElementById('outputDouble');
        const pesanCocok = document.getElementById('pesanCocok');
        const gridPerbedaan = document.getElementById('gridPerbedaan');
        const outputTidakCocok = document.getElementById('outputTidakCocok');
        const outputBerlebih = document.getElementById('outputBerlebih');

        wrapper.style.display = 'flex';
        boxDouble.style.display = 'none';
        pesanCocok.style.display = 'none';
        gridPerbedaan.style.display = 'none';
        outputDouble.value = '';
        outputTidakCocok.value = '';
        outputBerlebih.value = '';

        if (!hasilProsesStr || !pembandingStr) {
            alert("Mohon isi kolom 'Hasil Akhir / Manual' dan kolom 'Angka Pembanding' sebelum menekan Cocokkan.");
            wrapper.style.display = 'none';
            return;
        }

        let rawPembandingArr = parseAndExpand(pembandingStr);
        
        let cekSet = new Set();
        let doubleSet = new Set();

        for (let num of rawPembandingArr) {
            if (cekSet.has(num)) {
                doubleSet.add(num);
            } else {
                cekSet.add(num);
            }
        }

        let arrDouble = Array.from(doubleSet);
        if (arrDouble.length > 0) {
            boxDouble.style.display = 'block';
            outputDouble.value = arrDouble.join(' ');
        }

        let hasilArr = parseAndExpand(hasilProsesStr);
        let pembandingUnikArr = Array.from(cekSet); 

        let tidakDitemukan = hasilArr.filter(angka => !pembandingUnikArr.includes(angka));
        let angkaBerlebih = pembandingUnikArr.filter(angka => !hasilArr.includes(angka));

        if (tidakDitemukan.length === 0 && angkaBerlebih.length === 0) {
            pesanCocok.style.display = 'block';
        } else {
            gridPerbedaan.style.display = 'grid'; 
            
            if (tidakDitemukan.length > 0) {
                outputTidakCocok.value = tidakDitemukan.join(' ');
            } else {
                outputTidakCocok.value = "-";
            }

            if (angkaBerlebih.length > 0) {
                outputBerlebih.value = angkaBerlebih.join(' ');
            } else {
                outputBerlebih.value = "-";
            }
        }
    }
    
// FUNGSI REFRESH IFRAME + ANTI CACHE

// BAGI HASIL AKHIR MENJADI 2 BAGIAN TANPA MEMBUAT ANGKA BARU
function bagiHasilAkhirDuaBagian() {
    const outputTextArea = document.getElementById('outputData');
    const originalText = outputTextArea.value;

    if (!originalText.trim()) {
        alert('Kolom Hasil Akhir masih kosong.');
        return;
    }

    const lines = originalText.split(/\r?\n/);
    const bb4Lines = [];
    const bb3Lines = [];
    const otherBBDigits = [];
    const ordinaryNumbers = [];

    for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line || /^[-—]+$/.test(line)) continue;

        const bbMatch = line.match(/^(\d+)\s*bb\b/i);
        if (bbMatch) {
            const digitLength = bbMatch[1].length;
            if (digitLength === 4) {
                bb4Lines.push(line);
            } else if (digitLength === 3) {
                bb3Lines.push(line);
            } else {
                otherBBDigits.push(digitLength);
            }
            continue;
        }

        // Baca hanya angka 2D yang sudah ada; jangan membuat angka baru.
        const foundNumbers = line.split(/[\s.,]+/).filter(token => /^\d{2}$/.test(token));
        ordinaryNumbers.push(...foundNumbers);
    }

    if (otherBBDigits.length > 0) {
        alert('Ditemukan BB selain 4 angka dan 3 angka. Hasil tidak diubah agar data lain tidak hilang.');
        return;
    }

    if (bb4Lines.length !== 2) {
        alert(
            'Tombol BAGI 2 membutuhkan tepat 2 BB 4 angka. ' +
            'Saat ini ditemukan ' + bb4Lines.length + '. Hasil tidak diubah.'
        );
        return;
    }

    // Izinkan tombol ditekan kembali setelah hasil terbagi: gunakan BB3 yang sudah terbentuk.
    let selectedBB3Lines = [];
    let numbersAfterBB3 = [];

    if (bb3Lines.length === 2 && ordinaryNumbers.length === 33) {
        selectedBB3Lines = bb3Lines.slice();
        numbersAfterBB3 = ordinaryNumbers.slice();
    } else if (bb3Lines.length === 0 && ordinaryNumbers.length === 45) {
        if (new Set(ordinaryNumbers).size !== ordinaryNumbers.length) {
            alert('Ada angka biasa yang duplikat. Hasil tidak diubah agar jumlah angka tetap akurat.');
            return;
        }

        const ordinarySet = new Set(ordinaryNumbers);
        const digitSets = [];
        const digits = '0123456789';

        // Cari semua kombinasi 3 digit yang keenam pasangan bolak-baliknya
        // benar-benar tersedia di antara 45 angka biasa yang tersisa.
        function buildDigitSets(prefix, remainingDigits) {
            if (prefix.length === 3) {
                digitSets.push(prefix);
                return;
            }
            for (let i = 0; i < remainingDigits.length; i++) {
                buildDigitSets(prefix + remainingDigits[i], remainingDigits.slice(i + 1));
            }
        }
        buildDigitSets('', digits);

        const validBB3 = digitSets.map(digitSet => {
            const pairs = [];
            for (let i = 0; i < digitSet.length; i++) {
                for (let j = 0; j < digitSet.length; j++) {
                    if (i !== j) pairs.push(digitSet[i] + digitSet[j]);
                }
            }
            return { digitSet, pairs };
        }).filter(candidate => candidate.pairs.every(pair => ordinarySet.has(pair)));

        // Acak pilihan seperti fungsi BB yang sudah ada, lalu cari dua grup
        // yang tidak memakai pasangan 2D yang sama.
        for (let i = validBB3.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [validBB3[i], validBB3[j]] = [validBB3[j], validBB3[i]];
        }

        let selectedCandidates = null;
        for (let i = 0; i < validBB3.length && !selectedCandidates; i++) {
            const firstPairs = new Set(validBB3[i].pairs);
            for (let j = i + 1; j < validBB3.length; j++) {
                if (validBB3[j].pairs.every(pair => !firstPairs.has(pair))) {
                    selectedCandidates = [validBB3[i], validBB3[j]];
                    break;
                }
            }
        }

        if (!selectedCandidates) {
            alert('Tidak ditemukan 2 kombinasi BB 3 angka yang valid dan tidak saling bertumpuk dari 45 angka tersisa. Hasil tidak diubah.');
            return;
        }

        const bb3CoveredPairs = new Set();
        selectedCandidates.forEach(candidate => {
            candidate.pairs.forEach(pair => bb3CoveredPairs.add(pair));
            selectedBB3Lines.push(candidate.digitSet + ' bb 2a X');
        });

        // Enam pasangan untuk setiap BB3 dipindahkan dari angka biasa ke notasi BB3.
        numbersAfterBB3 = ordinaryNumbers.filter(number => !bb3CoveredPairs.has(number));

        if (numbersAfterBB3.length !== 33 || bb3CoveredPairs.size !== 12) {
            alert('Pemeriksaan jumlah angka tidak cocok. Hasil tidak diubah agar tidak ada data yang hilang.');
            return;
        }
    } else {
        alert(
            'Format sumber belum sesuai. Gunakan BB 4 terlebih dahulu, sehingga hasil berisi ' +
            '2 BB 4 angka dan 45 angka biasa. Jika sudah pernah dibagi, hasil harus berisi ' +
            '2 BB 4 angka, 2 BB 3 angka, dan 33 angka biasa. ' +
            'Saat ini ditemukan BB 4: ' + bb4Lines.length +
            ', BB 3: ' + bb3Lines.length +
            ', angka biasa: ' + ordinaryNumbers.length + '.'
        );
        return;
    }

    if (numbersAfterBB3.length !== 33 || selectedBB3Lines.length !== 2) {
        alert('Jumlah akhir tidak sesuai target 69 angka. Hasil tidak diubah.');
        return;
    }

    function groupIntoSix(numbers) {
        const rows = [];
        for (let i = 0; i < numbers.length; i += 6) {
            rows.push(numbers.slice(i, i + 6).join('.'));
        }
        return rows;
    }

    // 33 angka biasa dibagi menjadi 23 di bagian pertama dan 10 di bagian kedua.
    const firstPartNumbers = numbersAfterBB3.slice(0, 23);
    const secondPartNumbers = numbersAfterBB3.slice(23);

    const firstPart = [
        ...groupIntoSix(firstPartNumbers), // 6, 6, 6, 5 angka
        bb4Lines[0],
        selectedBB3Lines[0]
    ];
    const secondPart = [
        bb4Lines[1],
        selectedBB3Lines[1],
        ...groupIntoSix(secondPartNumbers) // 6, 4 angka
    ];

    outputTextArea.value = firstPart.join('\n') + '\n---\n' + secondPart.join('\n');
    document.getElementById('btnCopyText').innerText = 'Copy';
}

// SINGLE WEBSITE VIEWER — hanya satu URL untuk SD/SG/HK.
const DASHBOARD_WEB_URLS_KEY = 'dashboard1_web_urls_v1';
const DEFAULT_DASHBOARD_WEB_URL = 'https://toto.sdy2024.com';

function normalizeWebsiteUrl(value) {
    const raw = String(value || '').trim();
    if (!raw) return '';
    const candidate = /^https?:\/\//i.test(raw) ? raw : 'https://' + raw;
    let parsed;
    try {
        parsed = new URL(candidate);
    } catch (error) {
        throw new Error('Format URL tidak valid: ' + raw);
    }
    if (!['http:', 'https:'].includes(parsed.protocol)) {
        throw new Error('Link harus menggunakan http:// atau https://');
    }
    return parsed.href;
}

function loadSavedWebsiteUrl() {
    let url = DEFAULT_DASHBOARD_WEB_URL;
    try {
        const saved = JSON.parse(localStorage.getItem(DASHBOARD_WEB_URLS_KEY) || 'null');
        if (Array.isArray(saved)) {
            // Migrasi otomatis: ambil hanya slot pertama (SD/SG/HK) dari format lima website lama.
            url = String(saved[0] || '');
        } else if (typeof saved === 'string') {
            url = saved;
        }
    } catch (error) {
        console.warn('Pengaturan URL website tidak dapat dibaca:', error);
    }

    const input = document.getElementById('webUrl1');
    if (input) input.value = url;
    return url;
}

function applyWebsiteUrls() {
    if (!websiteSettingsUnlocked || !document.getElementById('webUrlPanel')?.classList.contains('is-open')) {
        window.alert('Masukkan PIN melalui ikon gear sebelum mengubah link website.');
        return;
    }

    const status = document.getElementById('webUrlStatus');
    const input = document.getElementById('webUrl1');
    const rawUrl = input ? input.value.trim() : '';

    if (!rawUrl) {
        status.textContent = 'Masukkan link website.';
        status.style.color = '#f87171';
        return;
    }

    let url;
    try {
        url = normalizeWebsiteUrl(rawUrl);
    } catch (error) {
        status.textContent = error.message;
        status.style.color = '#f87171';
        return;
    }

    try {
        // Simpan satu URL saja. Format array lama tetap dibaca saat migrasi.
        localStorage.setItem(DASHBOARD_WEB_URLS_KEY, JSON.stringify(url));
    } catch (error) {
        console.warn('URL tidak dapat disimpan di browser:', error);
    }

    renderDashboardWebsite(url);
    status.textContent = 'Link SD/SG/HK diterapkan dan disimpan di browser ini.';
    status.style.color = '#34d399';
}

// Tambahkan token agar browser meminta dokumen website terbaru.
function buildFreshWebsiteUrl(rawUrl, token) {
    const freshUrl = new URL(rawUrl);
    freshUrl.searchParams.set('_dashboard_refresh', String(token));
    return freshUrl.href;
}

// Render website dalam viewport desktop yang diperkecil agar seluruh lebar halaman terlihat.
// Tinggi viewport internal mengikuti tinggi panel; scrolling tetap vertikal di dalam iframe.
function fitWebsiteFrame() {
    const wrap = document.querySelector('.web-viewer-frame-wrap');
    const frame = document.getElementById('webIframe');
    if (!wrap || !frame) return;

    const desktopWidth = 380;
    const scale = Math.min(1, wrap.clientWidth / desktopWidth);
    const internalHeight = Math.max(900, Math.ceil(wrap.clientHeight / scale));

    wrap.style.setProperty('--website-scale', String(scale));
    frame.style.width = desktopWidth + 'px';
    frame.style.height = internalHeight + 'px';
}

(function initializeWebsiteFrameSizing() {
    const wrap = document.querySelector('.web-viewer-frame-wrap');
    if (!wrap) return;

    if (typeof ResizeObserver !== 'undefined') {
        const observer = new ResizeObserver(fitWebsiteFrame);
        observer.observe(wrap);
    } else {
        window.addEventListener('resize', fitWebsiteFrame, { passive: true });
    }

    fitWebsiteFrame();
})();

function renderDashboardWebsite(url) {
    const frame = document.getElementById('webIframe');
    const status = document.getElementById('webRefreshStatus');
    if (!frame) return;

    if (!url) {
        frame.src = 'about:blank';
        frame.dataset.originalUrl = '';

    }

    frame.dataset.originalUrl = url;
    frame.src = buildFreshWebsiteUrl(url, Date.now());
    if (status) status.textContent = 'Website SD/SG/HK dimuat otomatis.';
}

function reloadWebsiteFrame(frame, token) {
    if (!frame) return;
    const originalUrl = frame.dataset.originalUrl || '';

    frame.src = 'about:blank';

// GOOGLE SHEETS DASHBOARD API
const DASHBOARD_DATA_API_URL = 'https://type-shoot-sheet-test.vails.workers.dev';
const DASHBOARD_DATA_CATEGORIES = ['CAM', 'CHN', 'JPN', 'TWN'];
let selectedDataDate = '';
let showAllDashboardData = false;
let dashboardDataRequestInProgress = false;
let dashboardNumberFilterActive = false;
let dashboardDataRecords = [];
const DASHBOARD_FILTER_PREVIOUS_RESULTS = 4;
const DASHBOARD_FILTER_MAX_HIGHLIGHTS = 3;

function setDashboardDataStatus(message, isError = false) {
    const status = document.getElementById('dataHistoryStatus');
    if (status) {
        status.textContent = message;
        status.style.color = isError ? '#f87171' : '#94a3b8';
    }
}

function setDataEntryStatus(message, isError = false, isSuccess = false) {
    const status = document.getElementById('dataEntryStatus');
    if (!status) return;
    status.textContent = message;
    status.style.color = isError ? '#f87171' : (isSuccess ? '#34d399' : '#94a3b8');
}

async function callDashboardDataApi(payload) {
    const response = await fetch(DASHBOARD_DATA_API_URL, {
        method: 'POST',
        mode: 'cors',
        credentials: 'omit',
        cache: 'no-store',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });

    let result;
    try {
        result = await response.json();
    } catch (error) {
        throw new Error('Respons backend tidak dapat dibaca.');
    }

    if (!response.ok || !result || result.ok !== true) {
        throw new Error(result && result.error ? result.error : 'Permintaan database gagal.');
    }

    return result;
}

async function submitDashboardData(event) {
    if (event) event.preventDefault();

    const panel = document.getElementById('webUrlPanel');
    if (!websiteSettingsUnlocked || !panel || !panel.classList.contains('is-open')) {
        setDataEntryStatus('Buka pengaturan dengan PIN terlebih dahulu.', true);
        return;
    }

    if (dashboardDataRequestInProgress) return;

    const input = document.getElementById('dataEntryInput');
    const button = document.getElementById('dataEntrySubmit');
    const rawValue = input ? input.value.trim() : '';
    const parsed = rawValue.match(/^(CAM|CHN|JPN|TWN)\s*[-:=]?\s*(\d+)$/i);

    if (!parsed) {
        setDataEntryStatus('Format: CAM 1234, CHN 1234, JPN 1234, atau TWN 1234.', true);
        if (input) input.focus();
        return;
    }

    dashboardDataRequestInProgress = true;
    if (button) {
        button.disabled = true;
        button.textContent = 'MENYIMPAN...';
    }
    setDataEntryStatus('Mengirim data ke Google Sheets...');

    try {
        const result = await callDashboardDataApi({
            action: 'save',
            pin: DASHBOARD_WEBSITE_SETTINGS_PIN,
            input: rawValue
        });

        setDataEntryStatus(
            result.category + ' ' + result.value + ' — ' +
            (result.displayDate || result.date) + '. ' + result.message,
            false,
            true
        );

        if (input) {
            input.value = '';
            input.focus();
        }

        await loadDashboardData();
    } catch (error) {
        setDataEntryStatus(error.message || 'Gagal menyimpan data.', true);
    } finally {
        dashboardDataRequestInProgress = false;
        if (button) {
            button.disabled = false;
            button.textContent = 'SIMPAN DATA';
        }
    }
}

async function loadDashboardData() {
    setDashboardDataStatus('Memuat data 30 hari terakhir...');

    try {
        const result = await callDashboardDataApi({ action: 'list' });
        const records = Array.isArray(result.records) ? result.records : [];
        renderDashboardData(records);
        setDashboardDataStatus(
            records.length + ' tanggal berhasil dimuat dari Google Sheets.'
        );
    } catch (error) {
        renderDashboardData([]);
        setDashboardDataStatus(
            'Belum dapat memuat database: ' + (error.message || 'Koneksi gagal.'),
            true
        );
    }
}

function renderDashboardData(records) {
    dashboardDataRecords = Array.isArray(records) ? records.slice() : [];
    records = dashboardDataRecords;

    const tbody = document.getElementById('dataHistoryBody');
    if (!tbody) return;

    tbody.replaceChildren();

    if (!records.length) {
        const row = document.createElement('tr');
        const cell = document.createElement('td');
        cell.colSpan = 5;
        cell.className = 'data-history-empty';
        cell.textContent = 'Belum ada data untuk ditampilkan.';
        row.appendChild(cell);
        tbody.appendChild(row);
        selectedDataDate = '';
        showAllDashboardData = false;
        dashboardNumberFilterActive = false;
        updateDashboardHistoryMoreButton(0);
        updateDashboardFilterUI();
        return;
    }

    if (records.length <= 15) showAllDashboardData = false;

    records.forEach((record, index) => {
        const row = document.createElement('tr');
        row.className = 'data-row';
        if (!showAllDashboardData && index >= 15) row.classList.add('is-hidden-by-limit');
        row.dataset.date = String(record.date || '');

        if (selectedDataDate && selectedDataDate === row.dataset.date) {
            row.classList.add('is-selected');
        }

        const dateCell = document.createElement('td');
        const dateButton = document.createElement('button');
        dateButton.type = 'button';
        dateButton.className = 'data-date-button';
        dateButton.textContent = String(record.displayDate || record.date || '');
        dateButton.setAttribute('aria-pressed', row.classList.contains('is-selected') ? 'true' : 'false');
        dateButton.addEventListener('click', () => selectDataRow(row.dataset.date));
        dateCell.appendChild(dateButton);
        row.appendChild(dateCell);

        DASHBOARD_DATA_CATEGORIES.forEach(category => {
            const cell = document.createElement('td');
            cell.dataset.category = category;
            const value = record[category] === null || record[category] === undefined
                ? ''
                : String(record[category]).trim();

            if (value) {
                // Tampilkan dua digit terakhir sekitar 10% lebih besar dari digit sebelumnya.
                if (/^\d{3,}$/.test(value)) {
                    const prefix = document.createElement('span');
                    prefix.className = 'data-value-prefix';
                    prefix.textContent = value.slice(0, -2);

                    const suffix = document.createElement('span');
                    suffix.className = 'data-value-suffix';
                    suffix.textContent = value.slice(-2);

                    cell.append(prefix, suffix);
                } else {
                    cell.textContent = value;
                }
            } else {
                cell.textContent = '—';
                cell.classList.add('is-empty');
            }

            row.appendChild(cell);
        });

        tbody.appendChild(row);
    });

    updateDashboardHistoryMoreButton(records.length);
    applyDashboardNumberFilter();
    if (!dashboardNumberFilterActive) updateDashboardFilterUI();
}

function updateDashboardHistoryMoreButton(totalRows) {
    const button = document.getElementById('dataHistorySeeMore');
    if (!button) return;

    const canExpand = totalRows > 15 && !dashboardNumberFilterActive;
    button.hidden = !canExpand;
    button.setAttribute('aria-expanded', showAllDashboardData ? 'true' : 'false');
    button.textContent = showAllDashboardData ? 'SEE LESS' : 'SEE MORE';
}

function toggleDashboardHistory() {
    if (dashboardNumberFilterActive) return;
    const rows = Array.from(document.querySelectorAll('#dataHistoryBody .data-row'));
    if (rows.length <= 15) return;

    showAllDashboardData = !showAllDashboardData;
    rows.forEach((row, index) => {
        row.classList.toggle('is-hidden-by-limit', !showAllDashboardData && index >= 15);
    });

    updateDashboardHistoryMoreButton(rows.length);
}

function selectDataColumn(category) {
    if (!DASHBOARD_DATA_CATEGORIES.includes(category)) return;

    const table = document.getElementById('dataHistoryTable');
    if (!table) return;

    const current = table.dataset.focusColumn || '';
    const next = current === category ? '' : category;

    if (next) {
        table.dataset.focusColumn = next;
    } else {
        delete table.dataset.focusColumn;
    }

    document.querySelectorAll('.data-category-button').forEach(button => {
        button.setAttribute('aria-pressed',
            button.dataset.category === next ? 'true' : 'false');
    });

    // Filter mengikuti kategori yang sedang dipilih; melepas pilihan kolom mematikan filter.
    if (!next) dashboardNumberFilterActive = false;
    applyDashboardNumberFilter();
    if (!dashboardNumberFilterActive) updateDashboardFilterUI();
}

async function copyDashboardFilterResults(value) {
    const text = String(value || '').trim();
    if (!text) return false;

    if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        await navigator.clipboard.writeText(text);
        return true;
    }

    // Fallback untuk browser yang tidak menyediakan Clipboard API.
    const temporaryInput = document.createElement('textarea');
    temporaryInput.value = text;
    temporaryInput.setAttribute('readonly', '');
    temporaryInput.style.position = 'fixed';
    temporaryInput.style.left = '-9999px';
    temporaryInput.style.top = '0';
    document.body.appendChild(temporaryInput);
    temporaryInput.select();
    temporaryInput.setSelectionRange(0, temporaryInput.value.length);

    let copied = false;
    try {
        copied = document.execCommand('copy');
    } finally {
        temporaryInput.remove();
    }

    if (!copied) throw new Error('Browser menolak akses clipboard.');
    return true;
}

async function toggleDashboardNumberFilter() {
    const table = document.getElementById('dataHistoryTable');
    const category = table ? (table.dataset.focusColumn || '') : '';

    if (!DASHBOARD_DATA_CATEGORIES.includes(category)) {
        updateDashboardFilterUI('Pilih kolom CAM, CHN, JPN, atau TWN terlebih dahulu.');
        return;
    }

    dashboardNumberFilterActive = !dashboardNumberFilterActive;
    const selectedPairs = applyDashboardNumberFilter();

    if (!dashboardNumberFilterActive) {
        updateDashboardFilterUI();
        return;
    }

    if (!selectedPairs.length) {
        updateDashboardFilterUI('Filter aktif, tetapi belum ada pasangan valid untuk disalin.');
        return;
    }

    const clipboardText = selectedPairs.join('.');
    try {
        await copyDashboardFilterResults(clipboardText);
        updateDashboardFilterUI(
            'Filter ' + category + ' aktif. Kandidat ' + selectedPairs.join(' · ') +
            ' berhasil disalin: ' + clipboardText
        );
    } catch (error) {
        updateDashboardFilterUI(
            'Filter ' + category + ' aktif. Kandidat ' + selectedPairs.join(' · ') +
            '. Penyalinan otomatis diblokir browser; salin manual: ' + clipboardText
        );
    }
}

function updateDashboardFilterUI(message) {
    const button = document.getElementById('dataHistoryFilterToggle');
    const status = document.getElementById('dataHistoryFilterStatus');
    const table = document.getElementById('dataHistoryTable');
    if (!button || !status) return;

    const category = table ? (table.dataset.focusColumn || '') : '';
    const hasCategory = DASHBOARD_DATA_CATEGORIES.includes(category);

    button.disabled = !hasCategory;
    button.setAttribute('aria-pressed', dashboardNumberFilterActive ? 'true' : 'false');
    button.textContent = dashboardNumberFilterActive ? 'FILTER 2D: ON' : 'FILTER 2D';
    button.title = hasCategory
        ? 'Filter sedang memilih kategori ' + category
        : 'Pilih kategori CAM, CHN, JPN, atau TWN terlebih dahulu';

    if (message) {
        status.textContent = message;
    } else if (dashboardNumberFilterActive) {
        status.textContent = 'Filter ' + category + ' aktif: 4 hasil sebelumnya diperiksa; maksimal 3 pasangan valid disorot.';
    } else {
        status.textContent = hasCategory
            ? 'Kategori ' + category + ' dipilih. Tekan FILTER 2D untuk menyaring hasil historis.'
            : 'Pilih kolom kategori, lalu aktifkan FILTER 2D.';
    }
}

function applyDashboardNumberFilter() {
    const table = document.getElementById('dataHistoryTable');
    const tbody = document.getElementById('dataHistoryBody');
    if (!table || !tbody) return [];

    const rows = Array.from(tbody.querySelectorAll('.data-row'));

    // Bersihkan jejak filter lebih dahulu agar mode OFF selalu kembali normal.
    rows.forEach(row => {
        row.classList.remove('is-filter-hidden');
        row.querySelectorAll('.data-value-suffix').forEach(suffix => {
            suffix.classList.remove('is-filter-muted', 'is-filter-highlighted');
        });
    });

    if (!dashboardNumberFilterActive) {
        updateDashboardHistoryMoreButton(rows.length);
        return [];
    }

    const category = table.dataset.focusColumn || '';
    if (!DASHBOARD_DATA_CATEGORIES.includes(category)) {
        dashboardNumberFilterActive = false;
        updateDashboardHistoryMoreButton(rows.length);
        return [];
    }

    // Ambil hasil 4 digit kategori terpilih, urut terbaru ke terlama.
    const entries = rows.map(row => {
        const cell = row.querySelector('td[data-category="' + category + '"]');
        return {
            row,
            date: row.dataset.date || '',
            value: cell ? cell.textContent.trim() : '',
            suffix: cell ? cell.querySelector('.data-value-suffix') : null
        };
    }).filter(entry => /^\\d{4}$/.test(entry.value))
      .sort((a, b) => b.date.localeCompare(a.date));

    if (!entries.length) {
        updateDashboardHistoryMoreButton(rows.length);
        updateDashboardFilterUI('Tidak ada hasil 4 digit untuk kategori ' + category + '.');
        return [];
    }

    // Hasil terbaru menjadi acuan; empat hasil sebelumnya menjadi jendela historis.
    const visibleEntries = entries.slice(0, DASHBOARD_FILTER_PREVIOUS_RESULTS + 1);
    const visibleDates = new Set(visibleEntries.map(entry => entry.date));
    rows.forEach(row => {
        if (!visibleDates.has(row.dataset.date || '')) {
            row.classList.add('is-filter-hidden');
        }
    });

    const referencePair = visibleEntries[0].value.slice(-2);
    const excludedPrefix = referencePair.charAt(0);
    const excludedSuffix = referencePair.charAt(1);
    const seenPairs = new Set();
    const highlightedPairs = [];
    let mutedCount = 0;

    visibleEntries.forEach((entry, index) => {
        const pair = entry.value.slice(-2);
        const isDouble = pair.charAt(0) === pair.charAt(1);
        const hasExcludedPrefix = pair.charAt(0) === excludedPrefix;
        const hasExcludedSuffix = pair.charAt(1) === excludedSuffix;
        const isDuplicate = seenPairs.has(pair);
        const isReference = index === 0;

        // Maksimal 3 pasangan unik: selain itu dibuat abu-abu.
        const excluded = isReference || isDouble || hasExcludedPrefix ||
            hasExcludedSuffix || isDuplicate || highlightedPairs.length >= DASHBOARD_FILTER_MAX_HIGHLIGHTS;

        if (entry.suffix) {
            entry.suffix.classList.add(excluded ? 'is-filter-muted' : 'is-filter-highlighted');
        }

        if (!excluded) {
            highlightedPairs.push(pair);
        } else {
            mutedCount++;
        }

        seenPairs.add(pair);
    });

    updateDashboardHistoryMoreButton(rows.length);
    const candidateText = highlightedPairs.length ? highlightedPairs.join(' · ') : 'belum ada pasangan valid';
    updateDashboardFilterUI(
        'Filter ' + category + ' aktif. Kandidat: ' + candidateText +
        '. ' + mutedCount + ' pasangan abu-abu; data yang lebih lama disembunyikan.'
    );

    return highlightedPairs;
}

function selectDataRow(date) {
    selectedDataDate = selectedDataDate === date ? '' : date;

    document.querySelectorAll('#dataHistoryBody .data-row').forEach(row => {
        const selected = row.dataset.date === selectedDataDate;
        row.classList.toggle('is-selected', selected);
        const button = row.querySelector('.data-date-button');
        if (button) button.setAttribute('aria-pressed', selected ? 'true' : 'false');
    });
}

// Ambil data saat dashboard selesai memuat.
loadDashboardData();
